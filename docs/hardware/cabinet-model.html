<script type="module">
import * as THREE from 'three';

// ---------- Parameters ----------

const SCHEMA = [

  ['Legs and casters', 'casterInsetFront', 'Front caster inset (behind cheek front)', 3, 1, 15, 0.1, 'cm'],

  ['Keyboard (controller)', 'keyTop', 'Key top height', 74, 65, 85, 0.1, 'cm'],
  ['Keyboard (controller)', 'keyboardHeight', 'Height (shelf to key tops)', 8, 4, 15, 0.1, 'cm'],
  ['Keyboard (controller)', 'controllerWidth', 'Body width', 132, 120, 145, 0.1, 'cm'],
  ['Keyboard (controller)', 'controllerDepth', 'Body depth', 34, 20, 45, 0.1, 'cm'],
  ['Keyboard (controller)', 'keyRangeWidth', 'Width of the 88 keys', 122, 115, 130, 0.1, 'cm'],
  ['Keyboard (controller)', 'keySetback', 'Key fronts behind the cheek front', 7, 0, 20, 0.1, 'cm'],

  ['Keyboard (controller)', 'whiteKeyHeight', 'White key height', 2.2, 1, 3, 0.1, 'cm'],
  ['Keyboard (controller)', 'blackKeyLength', 'Black key length', 9.5, 6, 12, 0.1, 'cm'],
  ['Keyboard (controller)', 'blackKeyRise', 'Black keys above the white keys', 1.2, 0.5, 2, 0.1, 'cm'],
  ['Keyboard (controller)', 'controllerBackRise', 'Back section above the white keys', 0.3, 0, 5, 0.1, 'cm'],

  ['Speakers', 'speakerWidth', 'Width', 19, 10, 30, 0.1, 'cm'],
  ['Speakers', 'speakerHeight', 'Height', 29, 15, 45, 0.1, 'cm'],
  ['Speakers', 'speakerDepth', 'Depth', 22, 10, 35, 0.1, 'cm'],
  ['Speakers', 'speakerTilt', 'Tilt (face up)', 6.9, 0, 20, 0.1, '°'],
  ['Speakers', 'speakerSetback', 'Face behind the cabinet front', 4, 1, 15, 0.1, 'cm'],
  ['Speakers', 'speakerLift', 'Lift above the plinth', 3, 0, 20, 0.1, 'cm'],
  ['Speakers', 'wooferDiameter', 'Woofer diameter', 13, 5, 20, 0.1, 'cm'],
  ['Speakers', 'wooferHeight', 'Woofer centre height (on the face)', 10, 5, 30, 0.1, 'cm'],
  ['Speakers', 'tweeterDiameter', 'Tweeter diameter', 3.6, 1, 6, 0.1, 'cm'],
  ['Speakers', 'tweeterHeight', 'Tweeter centre height (on the face)', 22, 10, 40, 0.1, 'cm'],

  ['Electronics', 'pcLeft', 'PC left edge (from the centre)', -62, -75, 40, 0.1, 'cm'],
  ['Electronics', 'pcWidth', 'PC width', 35.6, 15, 50, 0.1, 'cm'],
  ['Electronics', 'pcHeight', 'PC height', 7.6, 3, 20, 0.1, 'cm'],
  ['Electronics', 'pcDepth', 'PC depth', 25.4, 10, 35, 0.1, 'cm'],
  ['Electronics', 'pcFrontGap', 'PC set back from the line', 0, 0, 10, 0.1, 'cm'],
  ['Electronics', 'ampLeft', 'Amp left edge (from the centre)', 5, -75, 70, 0.1, 'cm'],
  ['Electronics', 'ampWidth', 'Amp width', 13, 5, 30, 0.1, 'cm'],
  ['Electronics', 'ampHeight', 'Amp height', 4, 1, 15, 0.1, 'cm'],
  ['Electronics', 'ampDepth', 'Amp depth', 13, 5, 30, 0.1, 'cm'],
  ['Electronics', 'ampFrontGap', 'Amp set back from the line', 1, 0, 10, 0.1, 'cm'],
  ['Electronics', 'interfaceLeft', 'Interface left edge (from the centre)', 25, -75, 70, 0.1, 'cm'],
  ['Electronics', 'interfaceWidth', 'Interface width', 18, 5, 30, 0.1, 'cm'],
  ['Electronics', 'interfaceHeight', 'Interface height', 4.5, 1, 15, 0.1, 'cm'],
  ['Electronics', 'interfaceDepth', 'Interface depth', 10, 5, 30, 0.1, 'cm'],
  ['Electronics', 'interfaceFrontGap', 'Interface set back from the line', 2, 0, 10, 0.1, 'cm'],

  ['On the shelf', 'phoneWidth', 'Phone width', 7.4, 5, 10, 0.1, 'cm'],
  ['On the shelf', 'phoneHeight', 'Phone height', 16, 10, 20, 0.1, 'cm'],
  ['On the shelf', 'tabletWidth', 'Tablet width (landscape)', 25, 15, 35, 0.1, 'cm'],
  ['On the shelf', 'tabletHeight', 'Tablet height (landscape)', 17.8, 10, 25, 0.1, 'cm'],
  ['On the shelf', 'pageWidth', 'Sheet music page width', 21.5, 15, 30, 0.1, 'cm'],
  ['On the shelf', 'pageHeight', 'Sheet music page height', 28, 20, 35, 0.1, 'cm'],
];
const DEFAULTS = Object.fromEntries(SCHEMA.map(s => [s[1], s[3]]));
const RANGES = Object.fromEntries(SCHEMA.map(s => [s[1], [s[4], s[5]]]));
// A loaded or pasted value is kept only if it is a finite number, clamped to its slider's range.
function cleanValue(k, v) {
  if (!(k in DEFAULTS) || typeof v !== 'number' || !Number.isFinite(v)) return undefined;
  const [min, max] = RANGES[k];
  return Math.min(max, Math.max(min, v));
}
const STORE_KEY = 'piano-cabinet-params';

// Values persist across reloads, but only while the committed default they were tweaked from
// is unchanged: when a new version of this file changes a default, the new default wins.
function loadParams() {
  const params = { ...DEFAULTS };
  try {
    const stored = JSON.parse(localStorage.getItem(STORE_KEY));
    for (const [k, v] of Object.entries(stored?.values ?? {})) {
      const c = cleanValue(k, v);
      if (c !== undefined && stored.defaults?.[k] === DEFAULTS[k]) params[k] = c;
    }
  } catch { /* nothing stored, or unreadable: start from the defaults */ }
  return params;
}
function saveParams() {
  localStorage.setItem(STORE_KEY, JSON.stringify({ values: params, defaults: DEFAULTS }));
}
const params = loadParams();

// Converts the slider values (cm, degrees) to the units the geometry uses (metres, radians).
function toModelUnits(p) {
  const out = {};
  for (const [, key, , , , , , unit] of SCHEMA) {
    out[key] = unit === '°' ? THREE.MathUtils.degToRad(p[key]) : p[key] / 100;
  }
  return out;
}

// ---------- Scene setup ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
// Filmic tone mapping: highlights roll off smoothly and dark areas keep detail.
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.75;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9ccd1);
// Environment lighting: a real living room (an HDRI photo) for lighting and reflections.
// A simple virtual room stands in until the photo has loaded.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;
new EXRLoader().load('textures/lebombo_2k.exr', t => {
  t.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = t;
  pt.dirty = true;
});

// ---------- Textures (CC0; sources are listed in the README) ----------
const loadingManager = new THREE.LoadingManager(() => { pt.dirty = true; });
const texLoader = new THREE.TextureLoader(loadingManager);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(file, srgb = false) {
  const t = texLoader.load('textures/' + file);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const TEX = {
  wood:   { map: tex('wood_table_001_diff_2k.jpg', true), normalMap: tex('wood_table_001_nor_gl_2k.jpg'), roughnessMap: tex('wood_table_001_rough_2k.jpg') },
  floor:  { map: tex('laminate_floor_02_diff_1k.jpg', true), normalMap: tex('laminate_floor_02_nor_gl_1k.jpg'), roughnessMap: tex('laminate_floor_02_rough_1k.jpg') },
  fabric: { map: tex('fabric030_color_1k.jpg', true), normalMap: tex('fabric030_normal_1k.jpg'), roughnessMap: tex('fabric030_rough_1k.jpg') },
  brass:  { normalMap: tex('metal009_normal_1k.jpg'), roughnessMap: tex('metal009_rough_1k.jpg') },
};

// Path tracer state (set up further down); declared early so loaders can mark it out of date.
const pt = { on: false, tracer: null, dirty: true };

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
camera.position.set(1.6, 1.4, 2.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.65, 0);
controls.enableDamping = true;
controls.update();

// The environment now supplies most of the fill light, so the hemisphere light is turned down.
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2, 4, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 });
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ ...TEX.floor, roughness: 1 })
);
// Planks at real size: one texture tile covers 1.6 m of floor.
floor.geometry.attributes.uv.array.forEach((v, i, a) => { a[i] = v * 10 / 1.6; });
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ---------- Materials ----------
const mat = {
  // Lacquered wood: a base colour layer plus a glossy clear coat on top, like a real piano finish.
  // The finish (below) sets the colour and texture maps.
  wood:      new THREE.MeshPhysicalMaterial({ roughness: 0.45, clearcoat: 0.6, clearcoatRoughness: 0.15 }),
  woodDark:  new THREE.MeshStandardMaterial({ roughness: 0.6 }),
  // Glossy key plastic: slightly soft base with a smooth clear coat on top.
  whiteKey:  new THREE.MeshPhysicalMaterial({ color: 0xf2efe6, roughness: 0.35, clearcoat: 1.0, clearcoatRoughness: 0.06 }),
  blackKey:  new THREE.MeshPhysicalMaterial({ color: 0x0d0d0e, roughness: 0.4, clearcoat: 1.0, clearcoatRoughness: 0.08 }),
  // Polished, lacquered brass: fully metallic, lightly brushed (anisotropic), thin clear coat.
  brass:     new THREE.MeshPhysicalMaterial({
    color: 0xe0b764, metalness: 1.0, roughness: 0.3, ...TEX.brass, normalScale: new THREE.Vector2(0.3, 0.3),
    anisotropy: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.05,
  }),
  rubber:    new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 }),
  // Gear
  speaker:   new THREE.MeshStandardMaterial({ color: 0x1c1c1e, roughness: 0.6 }),
  cone:      new THREE.MeshStandardMaterial({ color: 0x2c2c2e, roughness: 0.9 }),
  tweeter:   new THREE.MeshStandardMaterial({ color: 0x8a8a8f, roughness: 0.3, metalness: 0.6 }),
  controller:new THREE.MeshStandardMaterial({ color: 0x18181a, roughness: 0.5 }),
  pc:        new THREE.MeshStandardMaterial({ color: 0x2a2a2d, roughness: 0.5 }),
  amp:       new THREE.MeshStandardMaterial({ color: 0x9a9ca0, roughness: 0.35, metalness: 0.7 }),
  scarlett:  new THREE.MeshStandardMaterial({ color: 0xb3121b, roughness: 0.4, metalness: 0.3 }),
  phone:     new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 }),
  screen:    new THREE.MeshStandardMaterial({ color: 0x0d1a2a, emissive: 0x16324f, emissiveIntensity: 0.8, roughness: 0.2 }),
  wall:      new THREE.MeshStandardMaterial({ color: 0xe4e1da, roughness: 1 }),
};
// Front "skin" panels get their own materials so X-ray can fade just them.
const skin = {
  fabric: new THREE.MeshStandardMaterial({ ...TEX.fabric, roughness: 1, transparent: true }),
  wood:   mat.wood.clone(),
};
skin.wood.transparent = true;

// Textures are mapped by real size, not stretched per face: each face is projected along its
// main axis, so grain runs up the sides and front and across the top (the image's grain runs along v).
// A per-part offset keeps neighbouring boards from showing the same patch of grain.
const UV_TILE = new Map([[mat.wood, 0.9], [skin.wood, 0.9], [mat.woodDark, 0.9], [skin.fabric, 0.25], [mat.brass, 0.25]]);
function boxUV(geo, tile, seed) {
  const pos = geo.attributes.position, nor = geo.attributes.normal;
  const uv = new Float32Array(pos.count * 2);
  const ou = (seed * 0.6180339) % 1, ov = (seed * 0.3710297) % 1;
  for (let i = 0; i < pos.count; i++) {
    const ax = Math.abs(nor.getX(i)), ay = Math.abs(nor.getY(i)), az = Math.abs(nor.getZ(i));
    let u, v;
    if (ay >= ax && ay >= az) { u = pos.getZ(i); v = pos.getX(i); }   // top and bottom: grain left to right
    else if (ax >= az)        { u = pos.getZ(i); v = pos.getY(i); }   // sides: grain vertical
    else                      { u = pos.getX(i); v = pos.getY(i); }   // front and back: grain vertical
    uv[2 * i] = u / tile + ou; uv[2 * i + 1] = v / tile + ov;
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}

// Helper: a box given its min/max extents (metres), so the layout reads like a drawing.
// Edges are rounded (up to 4 mm) so they catch highlights; thin parts get a proportionally smaller radius.
function roundedBox(w, h, d, maxR = 0.004) {
  const r = Math.min(maxR, Math.min(w, h, d) * 0.45);
  return new RoundedBoxGeometry(w, h, d, 2, r);
}
function box(name, material, [x0, y0, z0], [x1, y1, z1], parent) {
  const m = new THREE.Mesh(roundedBox(x1 - x0, y1 - y0, z1 - z0), material);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.name = name;
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// Helper: a disc facing +z (speaker cones, tweeters).
function disc(material, r, depth, [x, y, z], parent) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, depth, 32), material);
  m.rotation.x = Math.PI / 2;
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

// --- A generic piano-plugin control screen (piano-lab style), drawn on a canvas ---
// Header with name + preset, a grid of knobs with value arcs, a level meter and a mini keyboard.
function pluginScreenTexture(W, H, cols, rows) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const u = Math.min(W, H) / 100; // layout unit
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#20242c'); bg.addColorStop(1, '#121418');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // Header
  const headH = 12 * u;
  g.fillStyle = '#2a2f39'; g.fillRect(0, 0, W, headH);
  g.fillStyle = '#e6e8ec'; g.font = `600 ${5.2 * u}px system-ui, sans-serif`; g.textBaseline = 'middle';
  g.fillText('piano-lab', 4 * u, headH / 2);
  g.fillStyle = '#1a1d23'; const pw = Math.min(W * 0.5, 60 * u);
  g.fillRect(W - pw - 4 * u, headH * 0.22, pw, headH * 0.56);
  g.fillStyle = '#e0a040'; g.font = `${3.8 * u}px system-ui, sans-serif`;
  g.fillText('Upright · Living room', W - pw - 2 * u, headH / 2);
  // Mini keyboard along the bottom
  const kbH = 14 * u, kbY = H - kbH - 3 * u, kbX = 4 * u, kbW = W - 8 * u, whites = 21;
  const kw = kbW / whites;
  for (let i = 0; i < whites; i++) {
    g.fillStyle = i === 9 ? '#e0a040' : '#ecebe6';
    g.fillRect(kbX + i * kw + 0.5, kbY, kw - 1, kbH);
  }
  g.fillStyle = '#111';
  // Black keys sit between white keys, except after E and B (white index 2 and 6 within each octave from C).
  for (let i = 0; i < whites - 1; i++) {
    if (i % 7 === 2 || i % 7 === 6) continue;
    g.fillRect(kbX + (i + 1) * kw - kw * 0.3, kbY, kw * 0.6, kbH * 0.6);
  }
  // Level meter (right edge)
  const mX = W - 7 * u, mTop = headH + 5 * u, mH = kbY - mTop - 5 * u;
  g.fillStyle = '#0b0c0f'; g.fillRect(mX, mTop, 3 * u, mH);
  const lvl = g.createLinearGradient(0, mTop + mH, 0, mTop);
  lvl.addColorStop(0, '#3fbf6f'); lvl.addColorStop(0.75, '#e0c040'); lvl.addColorStop(1, '#e05040');
  g.fillStyle = lvl; g.fillRect(mX, mTop + mH * 0.38, 3 * u, mH * 0.62);
  // Knob grid
  const labels = ['Hammer', 'Strike', 'Damping', 'Unison', 'Soundbd', 'Sustain', 'Room', 'Volume', 'Tuning', 'Lid', 'Width', 'Tone'];
  const vals = [0.62, 0.45, 0.7, 0.3, 0.55, 0.8, 0.4, 0.72, 0.5, 0.35, 0.6, 0.48];
  const gx0 = 4 * u, gx1 = W - 11 * u, gy0 = headH + 4 * u, gy1 = kbY - 3 * u;
  const cw = (gx1 - gx0) / cols, ch = (gy1 - gy0) / rows;
  const r = Math.min(cw, ch) * 0.3;
  let k = 0;
  for (let ry = 0; ry < rows; ry++) for (let cx = 0; cx < cols; cx++, k++) {
    const x = gx0 + cw * (cx + 0.5), y = gy0 + ch * ry + ch * 0.42;
    const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25, av = a0 + (a1 - a0) * vals[k % vals.length];
    g.lineCap = 'round';
    g.strokeStyle = '#3a404c'; g.lineWidth = r * 0.22; g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke();
    g.strokeStyle = '#e0a040'; g.beginPath(); g.arc(x, y, r, a0, av); g.stroke();
    g.fillStyle = '#2c313b'; g.beginPath(); g.arc(x, y, r * 0.72, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#e6e8ec'; g.lineWidth = r * 0.1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(av) * r * 0.6, y + Math.sin(av) * r * 0.6); g.stroke();
    g.fillStyle = '#9aa1ad'; g.font = `${Math.max(2.6 * u, r * 0.42)}px system-ui, sans-serif`; g.textAlign = 'center';
    g.fillText(labels[k % labels.length], x, y + r * 1.55);
    g.textAlign = 'left';
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
// Screen material: the UI glows (emissive) under a glossy glass surface.
function screenMaterial(tex) {
  return new THREE.MeshPhysicalMaterial({
    color: 0x000000, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.9,
    roughness: 0.05, clearcoat: 1.0, clearcoatRoughness: 0.02,
  });
}
// Sheet music pages: staves plus some note heads, so it reads as music from a distance.
function musicPageTexture(seed) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 680;
  const g = c.getContext('2d');
  g.fillStyle = '#f7f4ea'; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = '#2b2b2b'; g.fillStyle = '#1e1e1e'; g.lineWidth = 1.4;
  let r = seed; const rand = () => (r = (r * 16807) % 2147483647) / 2147483647; // deterministic
  for (let s = 0; s < 9; s++) {
    const top = 70 + s * 66;
    for (let l = 0; l < 5; l++) { g.beginPath(); g.moveTo(40, top + l * 7); g.lineTo(472, top + l * 7); g.stroke(); }
    for (let x = 70; x < 460; x += 22 + rand() * 14) {
      const y = top - 7 + Math.floor(rand() * 9) * 3.5;
      g.beginPath(); g.ellipse(x, y, 4.2, 3, -0.4, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.moveTo(x + 4, y); g.lineTo(x + 4, y - 20); g.stroke();
    }
    for (const bx of [180, 320, 472]) { g.beginPath(); g.moveTo(bx, top); g.lineTo(bx, top + 28); g.stroke(); }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
// Textures and their materials are drawn once; only geometry is rebuilt when a slider moves.
const phoneScreenMat = screenMaterial(pluginScreenTexture(400, 880, 2, 4));
const tabletScreenMat = screenMaterial(pluginScreenTexture(1200, 840, 4, 2));
const pageMats = [12345, 67890].map(seed => new THREE.MeshStandardMaterial({ map: musicPageTexture(seed), roughness: 0.9 }));

// ---------- Wall (single-sided: invisible when orbiting behind it) ----------
const wall = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), mat.wall);
wall.position.y = 1.5;
wall.receiveShadow = true;
scene.add(wall);

// ---------- The piano, built from the parameters ----------
// Axes: x = width (bass on the left), y = up, z = towards the player.
// Positions are in metres; the cabinet's front face sits at z = FRONT.
const FRONT = 0.04;

// Builds the whole piano from parameters in model units. Returns its root group, the parts the
// toggles need, and the derived positions the report measures.
function build(P) {
  const piano = new THREE.Group(); piano.name = 'piano';

  const W = P.width, H = P.height;
  const BACK = FRONT - P.depth;            // back edge of the cabinet (open back)
  const SIDE = P.sideThickness;
  const IN = W / 2 - SIDE;                 // inner half-width
  const FLOOR = P.floorClearance;          // bottom of the side panels, plinth and toe blocks
  const PLINTH_TOP = FLOOR + P.plinthThickness;
  const KEY_Y = P.keyTop;                  // top of the white keys
  const SHELF_TOP = KEY_Y - P.keyboardHeight; // top of the keyboard shelf
  const KB_SHELF_BOTTOM = SHELF_TOP - P.keyboardShelfThickness;
  const ARM_W = P.cheekWidth;
  const ARM_FRONT = FRONT + P.cheekReach;  // front of the cheek blocks / toe blocks
  const FF = P.frontFrameDepth;            // depth of the front rails and boards

  wall.position.z = BACK - P.wallGap;

  // ---------- Cabinet ----------
  const cabinet = new THREE.Group(); cabinet.name = 'cabinet'; piano.add(cabinet);

  // The upper front leans back by SLANT, starting where the fallboard ends.
  const UP_Y0 = P.shelfHeight;             // bottom of the slanted upper front (= top of the music shelf)
  const SLANT = P.slant;                   // θ, lean-back angle of the upper front
  const TOP_Z = FRONT - (H - UP_Y0) * Math.tan(SLANT); // front edge at the top

  // Side panels: a side profile (vertical below UP_Y0, slanted above) extruded through the panel thickness.
  function sidePanel(name, xOuterToInner) {
    const s = new THREE.Shape();           // shape coords: (u = z, v = y)
    s.moveTo(BACK, FLOOR);
    s.lineTo(FRONT, FLOOR);
    s.lineTo(FRONT, UP_Y0);
    s.lineTo(TOP_Z, H);
    s.lineTo(BACK, H);
    s.closePath();
    // Small bevel (3 mm) = rounded edges; inset the depth so the panel stays SIDE thick overall.
    const BEV = 0.003;
    const m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, {
      depth: SIDE - 2 * BEV, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelOffset: -BEV, bevelSegments: 2,
    }), mat.wood);
    m.geometry.translate(0, 0, BEV);
    m.rotation.y = -Math.PI / 2;           // shape u -> world z, extrusion -> world -x
    m.position.x = xOuterToInner;          // panel spans [x - SIDE, x]
    m.name = name;
    m.castShadow = m.receiveShadow = true;
    cabinet.add(m);
  }
  sidePanel('side-left', -IN);
  sidePanel('side-right', W / 2);
  // Top lid, overhanging the sides, the back and the slanted front
  box('lid', mat.wood, [-W/2 - P.lidOverhangSide, H, BACK - P.lidOverhangBack],
      [W/2 + P.lidOverhangSide, H + P.lidThickness, TOP_Z + P.lidOverhangFront], cabinet);
  // Plinth (floor of the lower cabinet)
  box('plinth', mat.woodDark, [-IN, FLOOR, BACK], [IN, PLINTH_TOP, FRONT], cabinet);

  // Open back: just two posts and a cross rail for stiffness, like a real upright's back frame.
  for (const s of [-1, 1]) {
    const x = s * P.backPostSpacing / 2;
    box(`back-post-${s < 0 ? 'l' : 'r'}`, mat.woodDark, [x - P.backPostWidth / 2, PLINTH_TOP, BACK],
        [x + P.backPostWidth / 2, H, BACK + P.backFrameDepth], cabinet);
  }
  box('back-rail', mat.woodDark, [-IN, P.backRailHeight, BACK],
      [IN, P.backRailHeight + P.backRailThickness, BACK + P.backFrameDepth], cabinet);

  // --- Upper front: one seamless panel, leaning back by SLANT ---
  // Lift-off access like a real upright: held by hidden clips or magnets, no hinges, no seam.
  const upper = new THREE.Group(); upper.name = 'upper-panel';
  upper.position.set(0, UP_Y0, FRONT - 0.002);
  upper.rotation.x = -SLANT; // top leans back
  cabinet.add(upper);
  const PANEL_L = (H - UP_Y0) / Math.cos(SLANT);
  box('upper-panel', skin.wood, [-IN, 0, -P.upperPanelThickness], [IN, PANEL_L, 0], upper);
  // Inner shelf the electronics sit on, just above the fallboard.
  const E = UP_Y0 + P.electronicsShelfThickness; // shelf top
  box('electronics-shelf', mat.woodDark, [-IN, UP_Y0, BACK], [IN, E, FRONT - FF], cabinet);

  // --- Fallboard: a vertical board behind the keys with a flat shelf on top (Boston-style) ---
  // It hides the keyboard's back panel, and its top shelf is the one ledge for music and phone.
  const KEY_FRONT = ARM_FRONT - P.keySetback;
  const FALL_FRONT = KEY_FRONT - P.whiteKeyLength + P.fallboardOverhang; // overhangs the back ends of the keys
  const SHELF_T = P.musicShelfThickness;
  // Clears the black-key tops, leaving room to slide the keyboard in and out.
  const FALL_BOTTOM = KEY_Y + P.blackKeyRise + P.fallboardKeyGap;
  // Runs only between the cheek blocks, so its ends don't poke through their curved tops.
  const FALL_X = W / 2 - ARM_W;            // inner face of the cheek blocks
  box('fallboard', mat.wood, [-FALL_X, FALL_BOTTOM, FRONT - FF], [FALL_X, UP_Y0 - SHELF_T, FALL_FRONT], cabinet);
  const SHELF_FRONT = FALL_FRONT + P.musicShelfLip; // front edge of the phone/music shelf
  box('fallboard-shelf', mat.wood, [-FALL_X, UP_Y0 - SHELF_T, FRONT - FF], [FALL_X, UP_Y0, SHELF_FRONT], cabinet);

  // --- On the shelf: phone, tablet or sheet music, leaning back on the slanted panel ---
  function device(name, w, h, bezel, screenMat) {
    const d = new THREE.Group(); d.name = name;
    d.position.set(0, UP_Y0, FRONT + 0.004);
    d.rotation.x = -SLANT;
    cabinet.add(d);
    box(`${name}-body`, mat.phone, [-w / 2, 0, 0], [w / 2, h, 0.008], d);
    box(`${name}-screen`, screenMat, [-w / 2 + bezel, bezel, 0.008], [w / 2 - bezel, h - bezel, 0.0085], d);
    return d;
  }
  // Phone (portrait) and tablet (landscape, ~11"), each showing the plugin screen.
  const phone  = device('phone', P.phoneWidth, P.phoneHeight, 0.003, phoneScreenMat);
  const tablet = device('tablet', P.tabletWidth, P.tabletHeight, 0.008, tabletScreenMat);

  // Sheet music: an open book (two pages) standing on the shelf, leaning on the panel.
  const music = new THREE.Group(); music.name = 'sheet-music';
  music.position.set(0, UP_Y0, FRONT + 0.004);
  music.rotation.x = -SLANT;
  cabinet.add(music);
  [-1, 1].forEach((s, i) => {
    // Each page hinges at the spine (x = 0) and opens slightly towards the player.
    const hinge = new THREE.Group();
    hinge.rotation.y = s * -0.12;
    music.add(hinge);
    const page = new THREE.Mesh(new THREE.BoxGeometry(P.pageWidth, P.pageHeight, 0.003), [
      mat.whiteKey, mat.whiteKey, mat.whiteKey, mat.whiteKey, pageMats[i], mat.whiteKey, // +z face shows the music
    ]);
    page.position.set(s * P.pageWidth / 2, P.pageHeight / 2, 0.003);
    page.castShadow = true;
    hinge.add(page);
  });

  // --- Keyboard shelf and cheek blocks ---
  box('keyboard-shelf', mat.wood, [-IN, KB_SHELF_BOTTOM, BACK + P.backFrameDepth],
      [IN, SHELF_TOP, ARM_FRONT - P.keyboardShelfSetback], cabinet);
  // Curved cheek blocks: low at the front, sweeping up in a concave curve to the cabinet
  // (inspired by the Boston upright). Side profile extruded across the block's width.
  const ARM_LOW = KEY_Y + P.cheekRise, ARM_HIGH = UP_Y0; // flat top is flush with the top of the shelf
  const armShape = new THREE.Shape();    // shape coords: (u = z, v = y)
  armShape.moveTo(FRONT, KB_SHELF_BOTTOM);
  armShape.lineTo(ARM_FRONT, KB_SHELF_BOTTOM);
  armShape.lineTo(ARM_FRONT, ARM_LOW);
  // Flat top over roughly the back half, then a gentle curve down to the low front.
  const ARM_DY = ARM_HIGH - ARM_LOW;
  const ARM_FLAT_Z = SHELF_FRONT - P.cheekFlatSetback; // so the shelf protrudes past the cheek
  const DROP = ARM_FRONT - ARM_FLAT_Z;
  armShape.bezierCurveTo(
    ARM_FRONT - 0.35 * DROP, ARM_LOW,          // leave the front heading back, nearly level
    ARM_FLAT_Z + 0.15 * DROP, ARM_HIGH - 0.45 * ARM_DY, // rise fairly steeply near the shoulder
    ARM_FLAT_Z, ARM_HIGH
  );
  armShape.lineTo(FRONT, ARM_HIGH);            // flat top back to the cabinet
  armShape.closePath();
  for (const [s, n] of [[-1, 'left'], [1, 'right']]) {
    const x0 = s < 0 ? -W/2 : W/2 - ARM_W;
    const x1 = s < 0 ? -W/2 + ARM_W : W/2;
    const BEV = 0.003; // rounded edges, inset so the block keeps its size
    const arm = new THREE.Mesh(
      new THREE.ExtrudeGeometry(armShape, {
        depth: x1 - x0 - 2 * BEV, curveSegments: 24,
        bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelOffset: -BEV, bevelSegments: 2,
      }),
      mat.wood
    );
    arm.geometry.translate(0, 0, BEV);
    arm.rotation.y = -Math.PI / 2;      // shape u -> world z, extrusion -> world -x
    arm.position.x = x1;                // block spans [x0, x1]
    arm.name = `arm-${n}`;
    arm.castShadow = arm.receiveShadow = true;
    cabinet.add(arm);
  }

  // --- Lower front panel (knee board): fabric almost everywhere, with a narrow wooden
  // panel above the pedals, like the pedal lyre that supports a grand piano's pedals ---
  const LOW_Y0 = PLINTH_TOP, LOW_Y1 = KB_SHELF_BOTTOM;
  const RAIL = P.kneeRailHeight;
  const PEDAL_PANEL = P.pedalPanelWidth / 2;
  box('knee-rail-bottom', mat.wood, [-IN, LOW_Y0, FRONT - FF], [IN, LOW_Y0 + RAIL, FRONT], cabinet);
  box('knee-rail-top',    mat.wood, [-IN, LOW_Y1 - RAIL, FRONT - FF], [IN, LOW_Y1, FRONT], cabinet);
  box('pedal-panel', skin.wood, [-PEDAL_PANEL, LOW_Y0 + RAIL, FRONT - FF], [PEDAL_PANEL, LOW_Y1 - RAIL, FRONT], cabinet);
  for (const s of [-1, 1]) {
    const x0 = s < 0 ? -IN : PEDAL_PANEL, x1 = s < 0 ? -PEDAL_PANEL : IN;
    // Fabric sits back from the wooden frame, like an inset panel.
    box(`grille-${s < 0 ? 'left' : 'right'}`, skin.fabric,
        [x0, LOW_Y0 + RAIL, FRONT - P.fabricInset - P.fabricThickness], [x1, LOW_Y1 - RAIL, FRONT - P.fabricInset], cabinet);
  }

  // ---------- Legs, toe blocks, casters ----------
  const TOE_TOP = FLOOR + P.toeHeight;
  for (const [s, n] of [[-1, 'left'], [1, 'right']]) {
    const cx = s * (W/2 - ARM_W/2);                 // centred under the cheek block
    const LEG = ARM_W/2 - P.legInset, TOE = ARM_W/2 + P.toeOverhang;
    box(`leg-${n}`, mat.wood, [cx - LEG, TOE_TOP, ARM_FRONT - P.legSetback - P.legDepth],
        [cx + LEG, KB_SHELF_BOTTOM, ARM_FRONT - P.legSetback], cabinet);
    box(`toe-${n}`, mat.wood, [cx - TOE, FLOOR, FRONT], [cx + TOE, TOE_TOP, ARM_FRONT], cabinet);
  }
  const casterR = P.casterDiameter / 2;
  const casterGeo = new THREE.SphereGeometry(casterR, 16, 12);
  const cxs = W/2 - P.casterInsetSide;
  for (const [x, z] of [[-cxs, ARM_FRONT - P.casterInsetFront], [cxs, ARM_FRONT - P.casterInsetFront],
                        [-cxs, BACK + P.casterInsetBack], [cxs, BACK + P.casterInsetBack]]) {
    const c = new THREE.Mesh(casterGeo, mat.rubber);
    c.position.set(x, casterR, z); c.castShadow = true; cabinet.add(c);
  }

  // ---------- Pedals ----------
  const pedals = new THREE.Group(); pedals.name = 'pedals'; piano.add(pedals);
  // Top-view outline (u = x, v = -forward): a narrow lever that flares into a rounded foot pad.
  const lw = P.pedalLeverWidth / 2, pw = P.pedalPadWidth / 2, L = P.pedalLength, L1 = P.pedalLeverLength;
  const flareCtl = L1 + (L - L1) * 0.16, flareEnd = L - (L - L1) * 7 / 15;
  const pedalShape = new THREE.Shape();
  pedalShape.moveTo(-lw, 0);
  pedalShape.lineTo(-lw, -L1);
  pedalShape.quadraticCurveTo(-pw, -flareCtl, -pw, -flareEnd);
  pedalShape.quadraticCurveTo(-pw, -L, 0, -L);
  pedalShape.quadraticCurveTo(pw, -L, pw, -flareEnd);
  pedalShape.quadraticCurveTo(pw, -flareCtl, lw, -L1);
  pedalShape.lineTo(lw, 0);
  pedalShape.closePath();
  const pedalGeo = new THREE.ExtrudeGeometry(pedalShape, {
    depth: P.pedalThickness, curveSegments: 16,
    bevelEnabled: true, bevelThickness: 0.002, bevelSize: 0.002, bevelSegments: 2, // softened edges
  });
  ['soft', 'middle', 'sustain'].forEach((n, i) => {
    const pedal = new THREE.Group(); pedal.name = `pedal-${n}`;
    pedal.position.set((i - 1) * P.pedalSpacing, P.pedalHeight, FRONT - P.pedalSetback); // lever starts inside the cabinet
    pedal.rotation.x = -P.pedalTilt;                     // foot pad tilts up towards the front
    pedals.add(pedal);
    const m = new THREE.Mesh(pedalGeo, mat.brass);
    m.rotation.x = -Math.PI / 2;  // shape v -> world -z (forward is +z), extrusion -> world +y
    m.castShadow = true;
    pedal.add(m);
  });
  // Dark slot in the plinth where the levers come out.
  const SLOT_Y0 = P.pedalHeight - 0.008;
  box('pedal-slot', mat.rubber, [-P.pedalSlotWidth / 2, SLOT_Y0, FRONT - 0.002],
      [P.pedalSlotWidth / 2, SLOT_Y0 + P.pedalSlotHeight, FRONT + 0.001], pedals);

  // ---------- Gear (rough placeholder sizes, check real specs before building) ----------
  const gear = new THREE.Group(); gear.name = 'gear'; piano.add(gear);

  // Speakers: lower corners, outside the knee zone, behind the fabric, tilted up a little.
  const CENTRE = P.kneeZoneWidth / 2;
  const SPK_X = (IN + CENTRE) / 2;          // centred between the knee zone and the side panel
  for (const s of [-1, 1]) {
    const spk = new THREE.Group(); spk.name = `speaker-${s < 0 ? 'left' : 'right'}`;
    // Pivot at the bottom-front edge so the tilt lifts the face, not the base.
    spk.position.set(s * SPK_X, LOW_Y0 + P.speakerLift, FRONT - P.speakerSetback);
    spk.rotation.x = -P.speakerTilt;
    gear.add(spk);
    box('cabinet', mat.speaker, [-P.speakerWidth/2, 0, -P.speakerDepth], [P.speakerWidth/2, P.speakerHeight, 0], spk);
    disc(mat.cone, P.wooferDiameter / 2, 0.01, [0, P.wooferHeight, 0.002], spk);
    disc(mat.tweeter, P.tweeterDiameter / 2, 0.01, [0, P.tweeterHeight, 0.002], spk);
  }

  // Keyboard controller on the shelf: body + 88 keys. Its back panel hides under the fallboard.
  const KEYS_W = P.keyRangeWidth;
  const WHITE_LEN = P.whiteKeyLength, WHITE_H = P.whiteKeyHeight;
  const BLACK_LEN = P.blackKeyLength, BLACK_H = P.blackKeyRise;
  const CTRL_W = P.controllerWidth;
  const CTRL_TOP = KEY_Y + P.controllerBackRise;
  const LIP_TOP = KEY_Y - WHITE_H - 0.004;   // front lip ends just under the white keys
  const ctrlBackZ = KEY_FRONT + 0.005 - P.controllerDepth;
  const controller = new THREE.Group(); controller.name = 'controller'; gear.add(controller);
  // Body: lower front lip under the keys, taller section behind them.
  box('controller-base', mat.controller, [-CTRL_W/2, SHELF_TOP, ctrlBackZ], [CTRL_W/2, LIP_TOP, KEY_FRONT + 0.005], controller);
  box('controller-back', mat.controller, [-CTRL_W/2, LIP_TOP, ctrlBackZ], [CTRL_W/2, CTRL_TOP, KEY_FRONT - WHITE_LEN], controller);
  box('controller-cheek-l', mat.controller, [-CTRL_W/2, LIP_TOP, KEY_FRONT - WHITE_LEN], [-KEYS_W/2, CTRL_TOP, KEY_FRONT + 0.005], controller);
  box('controller-cheek-r', mat.controller, [KEYS_W/2, LIP_TOP, KEY_FRONT - WHITE_LEN], [CTRL_W/2, CTRL_TOP, KEY_FRONT + 0.005], controller);

  const keys = new Map(); // midi note -> mesh
  const WHITE_COUNT = 52;
  const ww = KEYS_W / WHITE_COUNT;
  const isBlack = m => [1, 3, 6, 8, 10].includes(m % 12);
  const whiteGeo = roundedBox(ww * 0.94, WHITE_H, WHITE_LEN, 0.0015);
  const blackGeo = roundedBox(ww * 0.55, WHITE_H, BLACK_LEN, 0.002);
  let whiteIndex = 0;
  for (let midi = 21; midi <= 108; midi++) {
    let mesh;
    if (!isBlack(midi)) {
      mesh = new THREE.Mesh(whiteGeo, mat.whiteKey);
      mesh.position.set(-KEYS_W/2 + ww * (whiteIndex + 0.5), KEY_Y - WHITE_H/2, KEY_FRONT - WHITE_LEN/2);
      whiteIndex++;
    } else {
      mesh = new THREE.Mesh(blackGeo, mat.blackKey);
      mesh.position.set(-KEYS_W/2 + ww * whiteIndex, KEY_Y - WHITE_H/2 + BLACK_H, KEY_FRONT - WHITE_LEN + BLACK_LEN/2);
    }
    mesh.name = `key-${midi}`;
    mesh.userData.midi = midi;
    mesh.castShadow = mesh.receiveShadow = true;
    controller.add(mesh);
    keys.set(midi, mesh);
  }

  // Upper cabinet: electronics on the inner shelf, behind the slanted panel.
  // Each item's front sits on a line EF (behind the panel), set back by its own gap.
  const EF = FRONT - P.gearSetback;
  const gearItems = [
    // PC: slim SilverStone-style Mini-ITX case, ~7.6 x 25.4 x 35.6 cm, lying flat.
    { name: 'pc', label: 'PC', material: mat.pc, left: P.pcLeft, w: P.pcWidth, h: P.pcHeight, d: P.pcDepth, gap: P.pcFrontGap },
    { name: 'fosi-amp', label: 'Amp', material: mat.amp, left: P.ampLeft, w: P.ampWidth, h: P.ampHeight, d: P.ampDepth, gap: P.ampFrontGap },
    { name: 'scarlett', label: 'Interface', material: mat.scarlett, left: P.interfaceLeft, w: P.interfaceWidth, h: P.interfaceHeight, d: P.interfaceDepth, gap: P.interfaceFrontGap },
  ];
  for (const g of gearItems) {
    g.front = EF - g.gap; g.back = g.front - g.d; g.right = g.left + g.w; g.top = E + g.h;
    box(g.name, g.material, [g.left, E, g.back], [g.right, g.top, g.front], gear);
  }

  return {
    piano, keys, gear, pedals, phone, tablet, music,
    // Positions and sizes the report measures (metres / radians).
    m: {
      W, H, BACK, IN, UP_Y0, SLANT, PANEL_L, E, SHELF_TOP, KB_SHELF_BOTTOM, ARM_W, ARM_FRONT,
      FALL_BOTTOM, FALL_FRONT, SHELF_FRONT, LOW_Y0, LOW_Y1, RAIL, CENTRE, SPK_X, KEY_Y, KEY_FRONT,
      CTRL_W, CTRL_TOP, ctrlBackZ, gearItems,
    },
  };
}

// ---------- Report: derived dimensions and design checks ----------
// Derived values follow from the parameters, so they have no sliders. Checks turn the design
// rules into numbers: each shows a margin (positive = fine) and turns red when it fails.
function measure(P, m) {
  const cm = v => v * 100;
  // Inner face of the slanted upper panel, as a z position at height y.
  const panelInnerZ = y => FRONT - 0.002 - (y - m.UP_Y0) * Math.tan(m.SLANT) - P.upperPanelThickness / Math.cos(m.SLANT);
  const g = m.gearItems;
  const sorted = [...g].sort((a, b) => a.left - b.left);
  const gaps = sorted.slice(1).map((it, i) => it.left - sorted[i].right);

  const derived = [
    ['Upper section height (shelf to lid)', cm(m.H - m.UP_Y0)],
    ['Upper panel length (along the slant)', cm(m.PANEL_L)],
    ['Overall depth (back to cheek front)', cm(m.ARM_FRONT - m.BACK)],
    ['Footprint from the wall', cm(m.ARM_FRONT - m.BACK + P.wallGap)],
    ['Space between the cheek blocks', cm(m.W - 2 * m.ARM_W)],
    ['Music shelf depth (from the panel)', cm(m.SHELF_FRONT - FRONT)],
    ['Keyboard shelf top height', cm(m.SHELF_TOP)],
    ['Keyboard shelf underside height', cm(m.KB_SHELF_BOTTOM)],
    ['Fallboard bottom height', cm(m.FALL_BOTTOM)],
    ['Leg width', cm(m.ARM_W - 2 * P.legInset)],
  ];
  // [label, margin (cm), minimum wanted (cm)]
  const spkTop = m.LOW_Y0 + P.speakerLift + P.speakerHeight * Math.cos(P.speakerTilt);
  const spkBackBottom = m.LOW_Y0 + P.speakerLift - P.speakerDepth * Math.sin(P.speakerTilt);
  const spkBackZ = FRONT - P.speakerSetback - P.speakerHeight * Math.sin(P.speakerTilt) - P.speakerDepth * Math.cos(P.speakerTilt);
  const leverOuter = P.pedalSpacing + P.pedalLeverWidth / 2;
  const checks = [
    ['Sheet music clears the lid', cm(m.H - (m.UP_Y0 + P.pageHeight * Math.cos(m.SLANT))), 3],
    ['Tablet clears the lid', cm(m.H - (m.UP_Y0 + P.tabletHeight * Math.cos(m.SLANT))), 1],
    ['Keyboard fits between the cheek blocks (each side)', cm((m.W - 2 * m.ARM_W - m.CTRL_W) / 2), 1],
    ['Keyboard clears the back frame', cm(m.ctrlBackZ - (m.BACK + P.backFrameDepth)), 0],
    ['Keyboard back slides under the fallboard', cm(m.FALL_BOTTOM - m.CTRL_TOP), 0.5],
    ['Electronics clear the upper panel', cm(Math.min(...g.map(it => panelInnerZ(it.top) - it.front))), 1],
    ['Electronics stay below the lid', cm(Math.min(...g.map(it => m.H - it.top))), 1],
    ['Electronics fit between the side panels', cm(Math.min(...g.map(it => Math.min(it.left + m.IN, m.IN - it.right)))), 0],
    ['Electronics don\'t overlap each other', cm(Math.min(...gaps)), 0],
    ['Electronics fit the cabinet depth', cm(Math.min(...g.map(it => it.back - m.BACK))), 0],
    ['Speakers stay outside the knee zone', cm(m.SPK_X - P.speakerWidth / 2 - m.CENTRE), 0],
    ['Speakers fit inside the side panels', cm(m.IN - (m.SPK_X + P.speakerWidth / 2)), 0],
    ['Speakers clear the plinth (tilted back edge)', cm(spkBackBottom - m.LOW_Y0), 0],
    ['Speakers fit under the knee rail', cm((m.LOW_Y1 - m.RAIL) - spkTop), 0],
    ['Speakers fit the cabinet depth', cm(spkBackZ - m.BACK), 0],
    ['Pedal levers fit the slot', cm(P.pedalSlotWidth / 2 - leverOuter), 0],
  ];
  return { derived, checks };
}

const reportEl = document.getElementById('report');
const fmt = v => `${v.toFixed(1)} cm`;
function renderReport({ derived, checks }) {
  const rows = (list, f) => list.map(f).join('');
  reportEl.innerHTML =
    `<h4>Derived (no sliders)</h4><table>${rows(derived, ([l, v]) => `<tr><td>${l}</td><td class="v">${fmt(v)}</td></tr>`)}</table>` +
    `<h4>Checks (margin)</h4><table>${rows(checks, ([l, v, min]) =>
      `<tr class="${v >= min - 1e-9 ? '' : 'bad'}"><td>${v >= min - 1e-9 ? '✓' : '✗'} ${l}</td><td class="v">${fmt(v)}</td>` +
      `<td class="want">≥ ${min} cm</td></tr>`)}</table>`;
}

// ---------- Build, and rebuild when a slider moves ----------
let current = null;
function rebuild() {
  if (current) {
    scene.remove(current.piano);
    current.piano.traverse(o => o.geometry?.dispose());
  }
  const P = toModelUnits(params);
  current = build(P);
  let seed = 1;
  current.piano.traverse(o => {
    const tile = o.isMesh && UV_TILE.get(o.material);
    if (tile) boxUV(o.geometry, tile, seed++);
  });
  scene.add(current.piano);
  applyShelf(shelfSel.value);
  pt.dirty = true;
  const report = measure(P, current.m);
  renderReport(report);
  window.piano = { ...window.piano, ...current, params, report };
}
// Slider drags fire many changes; rebuild at most once per frame.
let dirty = false;
function requestRebuild() { dirty = true; }

// ---------- Toggles ----------
const shelfSel = document.getElementById('shelf');
function applyShelf(v) {
  if (!current) return;
  current.phone.visible = v === 'phone'; current.tablet.visible = v === 'tablet'; current.music.visible = v === 'music';
}
shelfSel.addEventListener('change', () => { applyShelf(shelfSel.value); pt.dirty = true; });

const xray = document.getElementById('xray');
xray.addEventListener('change', () => {
  for (const m of Object.values(skin)) { m.opacity = xray.checked ? 0.12 : 1; m.depthWrite = !xray.checked; }
  pt.dirty = true;
});
// Finish: sets the cabinet wood, inner wood and grille fabric together.
// Colours multiply the textures (white shows the texture as photographed). The fabric photo is dark,
// so its tint is given in linear RGB and may go above 1.
const FINISHES = {
  // Satin walnut veneer under a softer clear coat.
  walnut: { grain: true, wood: 0xffffff, woodRough: 0.8, coat: 0.6, coatRough: 0.15, woodDark: 0x9a8a7c, fabric: [1.5, 0.98, 0.61] },
  // Polished ebony: no visible grain, a full mirror-like clear coat over a slightly soft black base.
  black:  { grain: false, wood: 0x0b0b0c, woodRough: 0.35, coat: 1.0, coatRough: 0.04, woodDark: 0x060606, fabric: [0.12, 0.12, 0.125] },
};
function setWoodMaps(m, on) {
  m.map = on ? TEX.wood.map : null;
  m.normalMap = on ? TEX.wood.normalMap : null;
  m.roughnessMap = on ? TEX.wood.roughnessMap : null;
  m.needsUpdate = true;
}
function applyFinish(name) {
  const f = FINISHES[name];
  for (const m of [mat.wood, skin.wood]) {
    setWoodMaps(m, f.grain);
    m.color.setHex(f.wood); m.roughness = f.woodRough;
    m.clearcoat = f.coat; m.clearcoatRoughness = f.coatRough;
  }
  setWoodMaps(mat.woodDark, f.grain);
  mat.woodDark.color.setHex(f.woodDark);
  skin.fabric.color.setRGB(...f.fabric);
  pt.dirty = true;
}
const finishSel = document.getElementById('finish');
finishSel.addEventListener('change', () => applyFinish(finishSel.value));
applyFinish(finishSel.value);

const wallBox = document.getElementById('wall');
wallBox.addEventListener('change', () => { wall.visible = wallBox.checked; pt.dirty = true; });

// ---------- Path-traced still ----------
// Off: the normal real-time view. On: three-gpu-pathtracer refines the same scene sample by sample
// (soft shadows, true reflections, light bouncing between surfaces). Orbiting restarts it.
const PT_MAX_SAMPLES = 2000;
const ptBox = document.getElementById('pathtrace');
const ptBar = document.getElementById('ptbar');
const ptStatus = document.getElementById('ptstatus');
ptBox.addEventListener('change', () => {
  pt.on = ptBox.checked;
  ptBar.hidden = !pt.on;
  if (pt.on && !pt.tracer) {
    pt.tracer = new WebGLPathTracer(renderer);
    pt.tracer.tiles.set(2, 2);
    pt.tracer.bounces = 6;
    pt.tracer.filterGlossyFactor = 0.5;
    pt.tracer.renderDelay = 0;
    pt.tracer.fadeDuration = 0;
    pt.tracer.minSamples = 1;
    window.piano.pt = pt;
  }
  pt.dirty = true;
});
document.getElementById('ptsave').addEventListener('click', () => {
  // Draw once more and read the canvas in the same task, before the browser clears it.
  pt.tracer.renderSample();
  renderer.domElement.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `piano-cabinet-${Math.floor(pt.tracer.samples)}spp.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
});

// ---------- Slider panel ----------
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(text) {
  toastEl.textContent = text; toastEl.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.style.opacity = 0; }, 1800);
}
const round = v => Math.round(v * 1e4) / 1e4;
const isChanged = k => Math.abs(params[k] - DEFAULTS[k]) > 1e-9;
function changedValues() {
  return Object.fromEntries(SCHEMA.map(s => s[1]).filter(isChanged).map(k => [k, round(params[k])]));
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch { window.prompt('Copy these values:', text); return false; }
}

const gui = new GUI({ title: 'Dimensions' });
const controllers = new Map();
function markChanged() {
  for (const [k, c] of controllers) c.domElement.classList.toggle('changed', isChanged(k));
}
function onParamsChanged() { markChanged(); saveParams(); requestRebuild(); }

const actions = {
  async copyChanged() {
    const v = changedValues(), n = Object.keys(v).length;
    if (await copyText(JSON.stringify(v, null, 2))) toast(n ? `Copied ${n} changed value${n > 1 ? 's' : ''}` : 'Nothing changed: copied {}');
  },
  async copyAll() {
    const all = Object.fromEntries(Object.entries(params).map(([k, v]) => [k, round(v)]));
    if (await copyText(JSON.stringify(all, null, 2))) toast('Copied all values');
  },
  async paste() {
    let text;
    try { text = await navigator.clipboard.readText(); } catch { text = window.prompt('Paste values (JSON):'); }
    if (!text) return;
    let values;
    try { values = JSON.parse(text); } catch { toast('That isn\'t valid JSON'); return; }
    if (!values || typeof values !== 'object' || Array.isArray(values)) { toast('Expected an object of values'); return; }
    let n = 0;
    for (const [k, v] of Object.entries(values)) {
      const c = cleanValue(k, v);
      if (c !== undefined) { params[k] = c; n++; }
    }
    // Pasted values start from the defaults: anything not in the paste goes back to its default.
    for (const k of Object.keys(DEFAULTS)) if (!(k in values)) params[k] = DEFAULTS[k];
    for (const c of controllers.values()) c.updateDisplay();
    onParamsChanged();
    toast(`Loaded ${n} value${n === 1 ? '' : 's'}; the rest are defaults`);
  },
  reset() {
    Object.assign(params, DEFAULTS);
    for (const c of controllers.values()) c.updateDisplay();
    onParamsChanged();
    toast('Back to the defaults');
  },
};
const valuesFolder = gui.addFolder('Values');
valuesFolder.add(actions, 'copyChanged').name('Copy changed values');
valuesFolder.add(actions, 'copyAll').name('Copy all values');
valuesFolder.add(actions, 'paste').name('Paste values');
valuesFolder.add(actions, 'reset').name('Reset to defaults');

const folders = new Map();
for (const [folder, key, label, , min, max, step, unit] of SCHEMA) {
  if (!folders.has(folder)) folders.set(folder, gui.addFolder(folder).close());
  const c = folders.get(folder).add(params, key, min, max, step).name(`${label} (${unit})`);
  c.onChange(onParamsChanged);
  // Double-click a slider's name to put that one value back to its default.
  c.domElement.querySelector('.name').addEventListener('dblclick', () => {
    params[key] = DEFAULTS[key]; c.updateDisplay(); onParamsChanged();
  });
  controllers.set(key, c);
}
folders.get('Cabinet').open();
markChanged();

window.piano = { scene, camera, controls, renderer, sun, mat, applyFinish, gui, DEFAULTS, rebuild };
rebuild();

// ---------- Loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  if (dirty) { dirty = false; rebuild(); }
  const moved = controls.update();
  if (pt.on) {
    const t = pt.tracer;
    if (pt.dirty) { pt.dirty = false; t.setScene(scene, camera); }
    else if (moved) t.updateCamera();
    t.pausePathTracing = t.samples >= PT_MAX_SAMPLES;
    t.renderSample();
    ptStatus.textContent = t.isCompiling ? 'Compiling…' : `${Math.floor(t.samples)} / ${PT_MAX_SAMPLES} samples`;
  } else {
    renderer.render(scene, camera);
  }
});
</script>
</body>
</html>
